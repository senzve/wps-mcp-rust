[package]
name = "wps-mcp-rust"
version = "0.1.0"
edition = "2021"
description = "Local stdio MCP server for docx/xlsx/text document processing"
license = "MIT"
readme = "README.md"

[[bin]]
name = "wps-mcp-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
calamine = "0.26"
cfb = "0.10"
encoding_rs = "0.8"
rmcp = { version = "0.12", features = ["server", "transport-io", "macros"] }
# schemars provided via rmcp
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
umya-spreadsheet = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
